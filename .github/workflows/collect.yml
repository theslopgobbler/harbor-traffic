name: Collect road data

on:
  schedule:
    - cron: '*/10 * * * *'   # GitHub often starts these 5–15 minutes late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch WSDOT alerts
        shell: pwsh
        env:
          WSDOT_ACCESS_CODE: ${{ secrets.WSDOT_ACCESS_CODE }}
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
        run: ./scripts/collect.ps1
      - name: Commit
        run: |
          git config user.name "harbor-traffic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data $(date -u +%FT%TZ)"
          git pull --rebase --autostash
          git push
